name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Check version files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version.json
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          cargo_version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["workspace"]["package"]["version"])
          PY
          )"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version.json contains an invalid version: $version"
            exit 1
          fi
          if [[ "$version" != "$cargo_version" ]]; then
            echo "::error::version.json ($version) does not match Cargo.toml ($cargo_version)"
            exit 1
          fi
          echo "Version **$version** is consistent." >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check dashboard
        working-directory: frontend
        run: npm run typecheck

      - name: Build dashboard (embedded at compile time)
        working-directory: frontend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ci-${{ matrix.os }}

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --locked -p aicrawl-cli

      - name: Smoke-test binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          actual="$(./target/release/aicrawl --version | awk '{print $2}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::binary reports $actual, expected $expected"
            exit 1
          fi

      - name: Smoke-test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = (Get-Content version.json | ConvertFrom-Json).version
          $actual = (& .\target\release\aicrawl.exe --version).Trim().Split(' ')[-1]
          if ($actual -ne $expected) {
            throw "binary reports $actual, expected $expected"
          }

      - name: Summary
        shell: bash
        run: echo "Built and tested AICrawl on ${{ matrix.os }}." >> "$GITHUB_STEP_SUMMARY"
