name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.0.1-experimental.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    name: Publish Windows x64 binary
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard dependencies
        working-directory: frontend
        run: npm ci

      - name: Build dashboard (embedded at compile time)
        working-directory: frontend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build release binary
        run: cargo build --release --locked -p aicrawl-cli

      - name: Stage release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/aicrawl.exe dist/aicrawl-windows-x64.exe
          $hash = (Get-FileHash dist/aicrawl-windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  aicrawl-windows-x64.exe" | Set-Content -Encoding ascii dist/aicrawl-windows-x64.exe.sha256
          .\dist\aicrawl-windows-x64.exe version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicrawl-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AICrawl ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/aicrawl-windows-x64.exe
            dist/aicrawl-windows-x64.exe.sha256

      - name: Release summary
        shell: pwsh
        run: |
          @"
          ### AICrawl release published

          - Tag: ${{ github.event.inputs.tag || github.ref_name }}
          - Asset: aicrawl-windows-x64.exe
          - Checksum: aicrawl-windows-x64.exe.sha256
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
