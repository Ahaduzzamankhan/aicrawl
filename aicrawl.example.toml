# AICrawl configuration (schema v1).
# Copy to ~/.aicrawl/config.toml or pass with `aicrawl --config <path>`.

[server]
api_host = "127.0.0.1"
api_port = 8080
mcp_host = "127.0.0.1"
mcp_port = 8787

[crawler]
max_pages = 10
max_depth = 2
concurrency = 4
timeout_ms = 15000
# Timeout for the optional Playwright bridge.
render_timeout_ms = 30000
max_body_bytes = 3145728
max_text_chars = 60000
max_crawl_secs = 180
user_agent = "AICrawl/1.0.0 (+https://github.com/Ahaduzzamankhan/aicrawl)"
respect_robots_txt = true
same_domain = true

[security]
# Keep false in production: loopback and private addresses are refused.
allow_private_networks = false
allowed_domains = []
blocked_domains = []
max_redirects = 5
rate_limit_per_minute = 60
allow_http = true

[extract]
# Hard cap on items produced by one list rule.
max_items = 1000
max_text_chars = 60000

[storage]
# database_path = "C:/Users/me/.aicrawl/aicrawl.db"
max_connections = 5

[cache]
enabled = true
ttl_secs = 3600
max_entries = 500

[api]
require_api_key = false
cors_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
request_timeout_secs = 120
