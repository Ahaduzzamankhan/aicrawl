<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AICrawl dashboard — Rust-powered crawling, AI-driven extraction, MCP-native integration."
    />
    <meta name="color-scheme" content="dark light" />
    <title>AICrawl — AI-powered web extraction</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316151d'/%3E%3Ctext x='32' y='45' font-size='40' text-anchor='middle' fill='%23b184ff'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("aicrawl.theme");
          document.documentElement.classList.toggle("dark", stored !== "light");
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
